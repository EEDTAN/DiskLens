name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the fast scanner
        run: node native/build.js
      - name: Build installer and portable app
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DiskLens ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/DiskLens-Setup.exe
            dist/DiskLens-Setup.exe.blockmap
            dist/latest.yml
            dist/DiskLens-Portable.exe
